{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block page_title %}Nouvelle Opération{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="card">
            <div class="card-body p-4">
                <h4 class="card-title mb-4">
                    <i class="bi bi-plus-circle"></i> Créer une nouvelle opération
                </h4>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="client" class="form-label">Client *</label>
                        <select class="form-select" id="client" name="client" required>
                            <option value="">Sélectionner un client</option>
                            {% for client in clients %}
                            <option value="{{ client.id }}">{{ client.full_name }} ({{ client.type_client }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="type_operation" class="form-label">Type d'opération *</label>
                            <select class="form-select" id="type_operation" name="type_operation" required>
                                <option value="collecte">Collecte</option>
                                <option value="depot">Dépôt</option>
                                <option value="retrait">Retrait</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="montant" class="form-label">Montant (€) *</label>
                            <input type="number" step="0.01" class="form-control" id="montant" name="montant" required>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="date_operation" class="form-label">Date d'opération *</label>
                            <input type="date" class="form-control" id="date_operation" name="date_operation" required>
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label">Statut *</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="en_attente">En attente</option>
                                <option value="en_cours">En cours</option>
                                <option value="terminee">Terminée</option>
                                <option value="annulee">Annulée</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Créer l'opération
                        </button>
                        <a href="{% url 'dashboard:home' %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Set today's date as default
document.getElementById('date_operation').valueAsDate = new Date();
</script>
{% endblock %}
